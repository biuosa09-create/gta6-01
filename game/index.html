<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1420; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Drive, steal cars, take missions and outrun the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<!-- Classic scripts, in load order, so the game also runs from file:// with no module CORS. -->
<script src="./src/util.js"></script>
<script src="./src/city.js"></script>
<script src="./src/audio.js"></script>
<script src="./src/input.js"></script>
<script src="./src/entities.js"></script>
<script src="./src/missions.js"></script>
<script src="./src/render.js"></script>
<script src="./src/hud.js"></script>
<script src="./src/save.js"></script>
<script src="./src/main.js"></script>
</body>
</html>
